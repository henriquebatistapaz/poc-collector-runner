spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/social_adapter}
spring.datasource.username=${DB_USERNAME:social_adapter}
spring.datasource.password=${DB_PASSWORD:social_adapter_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.address=${SERVER_ADDRESS:127.0.0.1}
runner.admin-api-key=${RUNNER_ADMIN_API_KEY:}
runner.retention-days=${POST_RETENTION_DAYS:0}
runner.events.enabled=${RUNNER_EVENTS_ENABLED:false}
runner.events.topic=${RUNNER_EVENTS_TOPIC:collector.items}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000
